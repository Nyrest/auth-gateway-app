services:
  migrate:
    build: .
    command: ["bun", "src/db/migrate.ts"]
    environment:
      DATABASE_URL: postgresql://auth_gateway:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/auth_gateway
    depends_on:
      database:
        condition: service_healthy
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      AUTH_GATEWAY_SECRET: ${AUTH_GATEWAY_SECRET:?Set a 32-byte base64url secret}
      DATABASE_URL: postgresql://auth_gateway:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/auth_gateway
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/health/live').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auth_gateway
      POSTGRES_USER: auth_gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_gateway -d auth_gateway"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
